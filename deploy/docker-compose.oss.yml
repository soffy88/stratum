name: aii

services:
  db:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.oss-postgres
    environment:
      POSTGRES_DB: ${AII_DB_NAME:?set AII_DB_NAME in deploy/.env}
      POSTGRES_USER: ${AII_DB_USER:?set AII_DB_USER in deploy/.env}
      POSTGRES_PASSWORD: ${AII_DB_PASSWORD:?set AII_DB_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      STRATUM_ENV: production
      STRATUM_PG_HOST: db
      STRATUM_PG_PORT: 5432
      STRATUM_PG_DB: ${AII_DB_NAME:?set AII_DB_NAME in deploy/.env}
      STRATUM_PG_USER: ${AII_DB_USER:?set AII_DB_USER in deploy/.env}
      STRATUM_PG_PASSWORD: ${AII_DB_PASSWORD:?set AII_DB_PASSWORD in deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in deploy/.env}
      ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET in deploy/.env}
      STRATUM_CORS_ALLOWED_ORIGINS: ${STRATUM_CORS_ALLOWED_ORIGINS}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
      VISUAL_BACKEND: ${VISUAL_BACKEND:-disabled}
    ports:
      - "127.0.0.1:9302:9302"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9302/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.oss-web
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      STRATUM_API_BASE: http://api:9302
      STRATUM_SL_BASE: http://api:9302
    ports:
      - "127.0.0.1:${AII_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
