name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  JWT_SECRET: test-secret-for-sl-unit-tests-32x
  STRATUM_PG_HOST: 127.0.0.1
  STRATUM_PG_PORT: 5435
  STRATUM_PG_USER: aii
  STRATUM_PG_PASSWORD: aii_safe_pass
  STRATUM_PG_DB: aii_kg

jobs:
  migration:
    name: PostgreSQL / migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aii
          POSTGRES_PASSWORD: aii_safe_pass
          POSTGRES_DB: aii_kg
        ports: [5435:5432]
        options: >-
          --health-cmd="pg_isready -U aii -d aii_kg"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Bootstrap PostgreSQL schema
        run: |
          PGPASSWORD="$STRATUM_PG_PASSWORD" psql -h "$STRATUM_PG_HOST" -p "$STRATUM_PG_PORT" -U "$STRATUM_PG_USER" -d "$STRATUM_PG_DB" -v ON_ERROR_STOP=1 -f src/stratum/db/pg_schema/001_stratum_base.sql
          PGPASSWORD="$STRATUM_PG_PASSWORD" psql -h "$STRATUM_PG_HOST" -p "$STRATUM_PG_PORT" -U "$STRATUM_PG_USER" -d "$STRATUM_PG_DB" -v ON_ERROR_STOP=1 -f src/stratum/db/pg_schema/002_substrate_chunk.sql
      - name: Apply all incremental migrations
        run: uv run python -m stratum.db.run_pg_migrations upgrade
      - name: Verify migration runner second run
        run: |
          uv run python -m stratum.db.run_pg_migrations upgrade
          PGPASSWORD="$STRATUM_PG_PASSWORD" psql -h "$STRATUM_PG_HOST" -p "$STRATUM_PG_PORT" -U "$STRATUM_PG_USER" -d "$STRATUM_PG_DB" -v ON_ERROR_STOP=1 -c "SELECT to_regclass('stratum.substrates'), to_regclass('stratum.substrate_chunk'), to_regclass('stratum.derived_artifact'), to_regclass('stratum.artifact_input'); SELECT filename FROM public._pg_migrations WHERE filename='051_source_soft_delete.sql';"

  tenant-security:
    name: Security / tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aii
          POSTGRES_PASSWORD: aii_safe_pass
          POSTGRES_DB: aii_kg
        ports: [5435:5432]
        options: >-
          --health-cmd="pg_isready -U aii -d aii_kg"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Bootstrap PostgreSQL schema
        run: |
          PGPASSWORD="$STRATUM_PG_PASSWORD" psql -h "$STRATUM_PG_HOST" -p "$STRATUM_PG_PORT" -U "$STRATUM_PG_USER" -d "$STRATUM_PG_DB" -v ON_ERROR_STOP=1 -f src/stratum/db/pg_schema/001_stratum_base.sql
          PGPASSWORD="$STRATUM_PG_PASSWORD" psql -h "$STRATUM_PG_HOST" -p "$STRATUM_PG_PORT" -U "$STRATUM_PG_USER" -d "$STRATUM_PG_DB" -v ON_ERROR_STOP=1 -f src/stratum/db/pg_schema/002_substrate_chunk.sql
          uv run python -m stratum.db.run_pg_migrations upgrade
      - run: >-
          uv run pytest -q --tb=short
          tests/service_layer/test_mvp_security_idor.py
          tests/integration/test_cross_corpus_block.py
          tests/http_api/test_wave5_routes.py

  architecture-runtime:
    name: Architecture / runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: >-
          uv run pytest -q --tb=short
          tests/architecture/test_aii_closure.py
          tests/architecture/test_final_production_closure.py
      - run: uv run python -c "from stratum.api.main import app; assert app is not None"

  backend:
    name: Backend / full regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aii
          POSTGRES_PASSWORD: aii_safe_pass
          POSTGRES_DB: aii_kg
        ports: [5435:5432]
        options: >-
          --health-cmd="pg_isready -U aii -d aii_kg"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest tests -q --tb=short --timeout=600

  static:
    name: Static / Ruff and Mypy delta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Changed-file Ruff and Mypy gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BEFORE_SHA"
          [[ "$EVENT_NAME" == "pull_request" ]] && base="$PR_BASE_SHA"
          [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] && base=HEAD^
          mapfile -t files < <(git diff --diff-filter=ACM --name-only "$base" HEAD -- '*.py' | sort -u)
          if ((${#files[@]})); then
            uv run ruff format --check "${files[@]}"
            uv run ruff check "${files[@]}"
            uv run mypy --ignore-missing-imports --follow-imports=skip "${files[@]}"
          fi

  frontend:
    name: Frontend / typecheck and build
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: aii-web}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: aii-web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --run
      - run: pnpm run type-check
      - run: pnpm build

  release-gate:
    name: Release / mergeable
    if: ${{ always() }}
    needs: [migration, tenant-security, architecture-runtime, backend, static, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require all release checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$RESULTS" = "success,success,success,success,success,success" || { echo "Required checks: $RESULTS"; exit 1; }
