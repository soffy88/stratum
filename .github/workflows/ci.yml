name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aii
          POSTGRES_PASSWORD: aii_safe_pass
          POSTGRES_DB: aii_kg
        ports:
          - 5435:5432
        options: >-
          --health-cmd="pg_isready -U aii -d aii_kg"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      JWT_SECRET: test-secret-for-sl-unit-tests-32x
      STRATUM_PG_HOST: 127.0.0.1
      STRATUM_PG_PORT: 5435
      STRATUM_PG_USER: aii
      STRATUM_PG_PASSWORD: aii_safe_pass
      STRATUM_PG_DB: aii_kg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --frozen
      - name: Check architecture boundaries
        run: uv run python scripts/check_architecture.py
      - name: Check AII naming convergence
        run: uv run python scripts/check_aii_naming.py
      - name: Validate SLO release-gate contract
        run: uv run python scripts/check_slo_gate.py
      - name: Bootstrap PostgreSQL schema and migrations
        run: uv run python scripts/bootstrap_pg_schema.py
      - name: Validate PostgreSQL release contract (019-028)
        run: uv run python scripts/check_pg_acceptance.py
      - name: Run tests
        run: |
          uv run python -m pytest tests/ -q --timeout=600

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aii-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: aii-web/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test -- --run
      - name: Type check
        run: pnpm run type-check
      - name: Lint
        run: pnpm run lint
      - name: Production build
        run: pnpm build
