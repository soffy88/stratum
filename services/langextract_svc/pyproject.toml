[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langextract-stratum"
version = "0.1.0"
description = "LangExtract (Apache-2.0) — inalized into stratum/3O: grounded structured extraction + visualization"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=1.8",
    "numpy>=1.20",
    "pandas>=1.3",
    "tqdm>=4.60",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["langextract"]
