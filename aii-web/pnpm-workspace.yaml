allowBuilds:
  canvas: true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@helios/blocks"
  - "@helios/oui"
# 安全修复(2026-10-17 依赖审计 🟡12):强制把传递依赖抬到已修复版本。
# canvas 只是 pdfjs-dist@3 在 Node 端渲染用的可选依赖,浏览器端不需要;
# 移除后连带去掉 @mapbox/node-pre-gyp → tar@6 / brace-expansion@1 两条高危链。
overrides:
  canvas: "-"
  postcss: "^8.5.23"
  nanoid@3: "^3.3.18"
  source-map-js: "^1.2.2"
  sharp: "^0.35.5"
  browserslist: "^4.28.7"
  baseline-browser-mapping: "^2.11.0"
  "@xmldom/xmldom": "^0.8.15"
  fflate@0: "^0.6.11"
  katex: "^0.18.2"
  tar: "^7.5.21"
  brace-expansion@1: "^1.1.21"
